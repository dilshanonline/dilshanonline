<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Dilshan Wijesooriya, Senior Cloud and Platform Engineer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1e2a6b"/>
      <stop offset="1" stop-color="#5b3b8c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="1" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="280" rx="18"/></clipPath>
    <path id="flight" d="M 440 225 C 600 120, 780 150, 1060 30"/>
  </defs>

  <style>
    .t { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; }
    @keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
    .cloudA { animation: drift 40s linear infinite; }
    .cloudB { animation: drift 60s linear infinite; }
    @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-1100px) } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#sky)"/>
    <rect width="1000" height="280" fill="url(#glow)"/>

    <!-- stars -->
    <g fill="#fff">
      <circle class="star" cx="60" cy="30" r="1.4"/>
      <circle class="star s2" cx="180" cy="18" r="1"/>
      <circle class="star s3" cx="320" cy="40" r="1.3"/>
      <circle class="star" cx="470" cy="22" r="1"/>
      <circle class="star s2" cx="560" cy="55" r="1.5"/>
      <circle class="star s3" cx="690" cy="26" r="1.1"/>
      <circle class="star" cx="820" cy="48" r="1.3"/>
      <circle class="star s2" cx="930" cy="20" r="1"/>
      <circle class="star s3" cx="250" cy="70" r="0.9"/>
      <circle class="star" cx="640" cy="90" r="0.9"/>
    </g>

    <!-- drifting clouds -->
    <g class="cloudA" fill="#ffffff" opacity="0.10">
      <g transform="translate(700 95)"><ellipse cx="0" cy="0" rx="60" ry="14"/><ellipse cx="-20" cy="-9" rx="28" ry="14"/><ellipse cx="18" cy="-8" rx="24" ry="12"/></g>
      <g transform="translate(1800 95)"><ellipse cx="0" cy="0" rx="60" ry="14"/><ellipse cx="-20" cy="-9" rx="28" ry="14"/><ellipse cx="18" cy="-8" rx="24" ry="12"/></g>
    </g>
    <g class="cloudB" fill="#ffffff" opacity="0.07">
      <g transform="translate(420 150)"><ellipse cx="0" cy="0" rx="90" ry="16"/><ellipse cx="-30" cy="-10" rx="36" ry="16"/><ellipse cx="25" cy="-9" rx="30" ry="14"/></g>
      <g transform="translate(1520 150)"><ellipse cx="0" cy="0" rx="90" ry="16"/><ellipse cx="-30" cy="-10" rx="36" ry="16"/><ellipse cx="25" cy="-9" rx="30" ry="14"/></g>
    </g>

    <!-- contrail + plane -->
    <use href="#flight" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 9"/>
    <g fill="#ffffff">
      <path d="M-22,-2.6 H12 Q22,0 12,2.6 H-22 Q-25,0 -22,-2.6Z"/>
      <path d="M-3,-2 L-12,-15 H-7 L7,-2Z"/>
      <path d="M-3,2 L-12,15 H-7 L7,2Z"/>
      <path d="M-18,-2 L-24,-8 H-21 L-14,-2Z"/>
      <path d="M-18,2 L-24,8 H-21 L-14,2Z"/>
      <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
        <mpath href="#flight"/>
      </animateMotion>
    </g>

    <!-- skyline with cable-stayed bridge -->
    <g fill="#0a0e22">
      <path d="M0 280 V248 H40 V232 H70 V250 H95 V222 H120 V240 H150 V214 H168 V206 H178 V214 H196 V246 H230 V236 H260 V252 H300 V280Z"/>
      <path d="M560 280 V250 H600 V226 H628 V244 H660 V212 H690 V238 H720 V230 H748 V252 H1000 V280Z"/>
      <rect x="300" y="258" width="260" height="6"/>
      <path d="M418 258 L438 168 L446 168 L442 258Z"/>
    </g>
    <g stroke="#0a0e22" stroke-width="1.4">
      <line x1="440" y1="172" x2="310" y2="258"/><line x1="440" y1="180" x2="340" y2="258"/>
      <line x1="440" y1="188" x2="370" y2="258"/><line x1="440" y1="196" x2="398" y2="258"/>
      <line x1="440" y1="172" x2="550" y2="258"/><line x1="440" y1="180" x2="520" y2="258"/>
      <line x1="440" y1="188" x2="490" y2="258"/>
    </g>
    <rect y="264" width="1000" height="16" fill="#070a18"/>

    <!-- text -->
    <text class="t" x="48" y="92" fill="#ffffff" font-size="40" font-weight="700">Dilshan Wijesooriya</text>
    <text class="t" x="50" y="126" fill="#c7d2fe" font-size="19">Senior Cloud &amp; Platform Engineer · Rotterdam</text>
    <g class="t" font-size="13" font-weight="600" fill="#e0e7ff">
      <rect x="50" y="146" width="62" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
      <text x="81" y="164" text-anchor="middle">AWS</text>
      <rect x="120" y="146" width="104" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
      <text x="172" y="164" text-anchor="middle">Kubernetes</text>
      <rect x="232" y="146" width="96" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
      <text x="280" y="164" text-anchor="middle">Terraform</text>
      <rect x="336" y="146" width="118" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
      <text x="395" y="164" text-anchor="middle">Observability</text>
    </g>
  </g>
</svg>
