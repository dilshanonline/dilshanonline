  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1e2a6b"/>
      <stop offset="1" stop-color="#5b3b8c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="1" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="280" rx="18"/></clipPath>
    <path id="flight" d="M 440 225 C 600 120, 780 150, 1060 30"/>
  </defs>

  <style>
    .t { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; }
    @keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
    .cloudA { animation: drift 40s linear infinite; }
    .cloudB { animation: drift 60s linear infinite; }
    @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-1100px) } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#sky)"/>
